name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on semantic version tags (v1.0.0, v2.1.3, etc.)

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows AMD64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: LumpfishMediaCatcher.exe
            archive_type: zip

          # Linux AMD64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: LumpfishMediaCatcher
            archive_type: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -v -ldflags="-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o ${{ matrix.artifact_name }} ./cmd/lumpfishmediacatcher

      - name: Prepare archive (Windows)
        if: matrix.archive_type == 'zip'
        shell: bash
        run: |
          mkdir -p LumpfishMediaCatcher
          mv ${{ matrix.artifact_name }} LumpfishMediaCatcher/
          cp README.md LumpfishMediaCatcher/ || true
          cp LICENSE LumpfishMediaCatcher/ || true

      - name: Create ZIP archive (Windows)
        if: matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          $archiveName = "LumpfishMediaCatcher-${{ steps.get_version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          Compress-Archive -Path LumpfishMediaCatcher -DestinationPath $archiveName
          echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_OUTPUT
        id: archive_windows

      - name: Prepare archive (Unix)
        if: matrix.archive_type == 'tar.gz'
        run: |
          mkdir -p LumpfishMediaCatcher
          mv ${{ matrix.artifact_name }} LumpfishMediaCatcher/
          cp README.md LumpfishMediaCatcher/ || true
          cp LICENSE LumpfishMediaCatcher/ || true
          ARCHIVE_NAME="LumpfishMediaCatcher-${{ steps.get_version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" LumpfishMediaCatcher
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
        id: archive_unix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumpfishMediaCatcher-${{ matrix.goos }}-${{ matrix.goarch }}
          path: LumpfishMediaCatcher-${{ steps.get_version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.*
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release - use all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Generate changelog since last tag
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Create release notes file
          cat > release_notes.md <<EOF
          ## What's New in ${{ steps.get_version.outputs.VERSION }}

          ### Changes
          $CHANGELOG

          ### Downloads
          - **Windows (64-bit)**: \`LumpfishMediaCatcher-${{ steps.get_version.outputs.VERSION }}-windows-amd64.zip\`
          - **Linux (64-bit)**: \`LumpfishMediaCatcher-${{ steps.get_version.outputs.VERSION }}-linux-amd64.tar.gz\`

          ### Requirements
          - Go 1.21+ (for building from source)
          - yt-dlp (can be installed automatically on first run)

          See README.md for installation and usage instructions.
          EOF

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.get_version.outputs.VERSION }} \
            --title "LumpfishMediaCatcher ${{ steps.get_version.outputs.VERSION }}" \
            --notes-file release_notes.md \
            artifacts/**/*
